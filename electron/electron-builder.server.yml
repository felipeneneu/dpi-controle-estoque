appId: com.felipeneneu.dpi-controle-estoque.server
productName: Dpi Controle de Estoque Server
directories:
  output: ../dist/server
files:
  - main.js
  - preload.js
extraResources:
  - from: ../grafica-app/out
    to: graficaos/ui
  - from: ../grafica-app/backend
    to: graficaos/backend
    filter:
      - "dist/**"
      - "drizzle/**"
      - "public/**"
      - "package.json"
  - from: config/server.json
    to: graficaos/mode.json
win:
  icon: build/icon.ico
  target:
    - nsis
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Dpi Controle de Estoque Server
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico