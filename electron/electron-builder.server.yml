appId: com.felipeneneu.dpi-controle-estoque.server
productName: Dpi Controle de Estoque Server
afterPack: scripts/bake-icons.cjs
directories:
  output: ../dist/server
files:
  - main.js
  - preload.js
  - discovery.js
  - build/icon.png
  - build/icon.ico
extraResources:
  - from: ../grafica-app/out
    to: graficaos/ui
  - from: staging/backend
    to: graficaos/backend
    filter:
      - "dist/**"
      - "drizzle/**"
      - "public/**"
      - "node_modules/**"
      - "package.json"
      - "package-lock.json"
      - ".env"
  - from: config/server.json
    to: graficaos/mode.json
win:
  icon: build/icon.ico
  target:
    - nsis
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Dpi Controle de Estoque Server
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico