appId: com.felipeneneu.dpi-controle-estoque.client
productName: Dpi Controle de Estoque
directories:
  output: ../dist/client
files:
  - main.js
  - preload.js
  - discovery.js
  - build/icon.png
  - build/icon.ico
extraResources:
  - from: ../grafica-app/out
    to: graficaos/ui
  - from: config/client.json
    to: graficaos/mode.json
  - from: ../sidecars/ImpositorKonica/bin/Release/net8.0-windows/win-x64/publish/ImpositorKonica.exe
    to: bin/ImpositorKonica.exe
win:
  icon: build/icon.ico
  target:
    - nsis
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Dpi Controle de Estoque
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico