name: imposition-grid release

on:
  push:
    tags: ['imposition-grid-v*']

jobs:
  publish:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: packages/imposition-grid-cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: publish (NativeAOT)
        run: dotnet publish -c Release -r win-x64 --self-contained -p:PublishAot=true
      - uses: actions/upload-artifact@v4
        with:
          name: imposition-grid-win-x64
          path: packages/imposition-grid-cli/bin/Release/net8.0/win-x64/publish/imposition-grid.exe
