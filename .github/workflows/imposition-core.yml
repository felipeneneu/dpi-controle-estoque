name: imposition-core

on:
  pull_request:
    paths:
      - 'packages/imposition-core/**'
      - 'sidecars/AutoImposerCLI/**'
      - '.github/workflows/imposition-core.yml'
  push:
    branches: [main]
    paths:
      - 'packages/imposition-core/**'
      - 'sidecars/AutoImposerCLI/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/imposition-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: restore
        run: dotnet restore
      - name: build (warnings as errors)
        run: dotnet build --no-restore -c Release
      - name: test (golden canônico obrigatório + sidecars cross-motor)
        run: |
          dotnet test --no-build -c Release --logger "console;verbosity=detailed"
          dotnet test ../../sidecars/AutoImposerCLI/tests/AutoImposerCLI.Tests -c Release --logger "console;verbosity=detailed"
      - name: upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: packages/imposition-core/**/TestResults/*.trx
