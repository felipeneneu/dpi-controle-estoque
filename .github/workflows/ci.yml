name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (typecheck + unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grafica-app/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grafica-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (export)
        run: npm run build

  e2e:
    name: E2E (Playwright chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root deps
        run: npm ci

      - name: Install sub-project deps
        run: |
          npm --prefix grafica-app ci
          npm --prefix grafica-app/backend ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Build UI + backend
        run: npm run e2e:build

      - name: Run E2E
        run: npx playwright test --config=e2e/playwright.config.ts

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  installers:
    name: Build installers (.exe) + GitHub Release
    runs-on: windows-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root deps
        run: npm ci

      - name: Install UI deps
        run: npm --prefix grafica-app ci

      - name: Install backend deps
        run: npm --prefix grafica-app/backend ci

      - name: Install electron deps
        run: npm --prefix electron ci

      - name: Build UI (static export)
        run: npm run build:export

      - name: Build backend
        run: npm run build:backend

      - name: Package Server installer
        run: npm --prefix electron run package:server

      - name: Package Client installer
        run: npm --prefix electron run package:client

      - name: Upload installers (workflow artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: dpi-installers
          path: |
            dist/server/*.exe
            dist/client/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release (on tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/server/*.exe dist/client/*.exe \
            --generate-notes --draft=false || true